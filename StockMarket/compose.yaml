services:
  exchange-alpha:
    restart: unless-stopped
    build:
      context: .
      dockerfile: StockMarketImitator/Dockerfile
    environment:
      Simulator__ExchangeName: alpha
      Simulator__Format: Alpha
    ports:
      - "5001:8080"

  exchange-beta:
    restart: unless-stopped
    build:
      context: .
      dockerfile: StockMarketImitator/Dockerfile
    environment:
      Simulator__ExchangeName: beta
      Simulator__Format: Beta
    ports:
      - "5002:8080"

  exchange-gamma:
    restart: unless-stopped
    build:
      context: .
      dockerfile: StockMarketImitator/Dockerfile
    environment:
      Simulator__ExchangeName: gamma
      Simulator__Format: Gamma
    ports:
      - "5003:8080"

  postgres:
    restart: unless-stopped
    image: postgres:17
    environment:
      POSTGRES_DB: marketdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketdata"]
      interval: 5s
      timeout: 3s
      retries: 10

  aggregator:
    restart: unless-stopped
    build:
      context: .
      dockerfile: StockAggregator/Dockerfile
    environment:
      Aggregator__ConnectionString: Host=postgres;Database=marketdata;Username=postgres;Password=${POSTGRES_PASSWORD}
      Aggregator__Sources__0__Id: alpha
      Aggregator__Sources__0__Url: ws://exchange-alpha:8080/ws
      Aggregator__Sources__0__Format: Alpha
      Aggregator__Sources__1__Id: beta
      Aggregator__Sources__1__Url: ws://exchange-beta:8080/ws
      Aggregator__Sources__1__Format: Beta
      Aggregator__Sources__2__Id: gamma
      Aggregator__Sources__2__Url: ws://exchange-gamma:8080/ws
      Aggregator__Sources__2__Format: Gamma
    ports:
      - "5100:8080"
    depends_on:
      postgres:
        condition: service_healthy
      exchange-alpha:
        condition: service_started
      exchange-beta:
        condition: service_started
      exchange-gamma:
        condition: service_started

  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v3.4.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    restart: unless-stopped
    image: grafana/grafana:12.0.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/provisioning/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
